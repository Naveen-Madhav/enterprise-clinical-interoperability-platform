name: Verify interfaces
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/cache@v4
        with:
          path: runtime/standards
          key: hl7-standards-${{ hashFiles('src/interop/standards-assets.json') }}
      - run: interop-platform prepare-standards
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: interop-platform demo
